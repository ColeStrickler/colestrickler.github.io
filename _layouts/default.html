    {% include head-custom.html %}
  </head>
  <body>

        <p>colestrickler [at] gmail [dot] com</p>
        <p><a href="https://github.com/ColeStrickler">View My GitHub Profile</a></p>

      <main>
        {{ content }}

        <p>Hosted on GitHub Pages</p>
